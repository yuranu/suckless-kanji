# Cloudflare Worker: static client from web/ plus the sync/auth API in server/worker.js.
# Deploy: npx wrangler deploy (see README "Server").
name = "suckless-kanji"
main = "server/worker.js"
compatibility_date = "2026-09-01"
# www and the old kanji.yuranu.com are served by the redirect Worker (server/redirect.wrangler.toml).
routes = [{ pattern = "suckless-kanji.com", custom_domain = true }]

[assets]
directory = "web"
binding = "ASSETS"
# Static files are served directly (free, not counted against the Worker quota); the
# Worker only runs for the API and sign-in.
run_worker_first = ["/api/*", "/auth/*"]

[vars]
GOOGLE_CLIENT_ID = "276404407742-dq3le281o8mocggu96eqltkdds8egf5r.apps.googleusercontent.com"
# Signup and limits. Worst case (every account at its quota): MAX_USERS * MAX_USER_BYTES =
# 3 GB of event data, which with indexes stays within D1's free 5 GB.
SIGNUP_MODE = "open"           # or "allowlist" (only emails added with scripts/server/users.sh allow)
MAX_USERS = "100"
MAX_USER_BYTES = "30000000"    # ~5 years of heavy daily use; raise per account: users.sh quota
MAX_EVENT_BYTES = "65536"

# Requests per minute. An active learner syncs at most every few seconds (answers are batched,
# 4 s debounce) and a new device downloads ~1000 events per request; 60/min leaves headroom
# while capping a scripted account. Sign-in is limited per IP.
[[ratelimits]]
name = "SYNC_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "suckless-kanji"
database_id = "094483b8-10ca-4e37-9584-4560f84b95eb" # replaced by the real id on first deploy
migrations_dir = "server/migrations"
