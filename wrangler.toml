# Cloudflare Worker: static client from web/ plus the sync/auth API in server/worker.js.
# Deploy: npx wrangler deploy (see README "Server").
name = "suckless-kanji"
main = "server/worker.js"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "suckless-kanji.com", custom_domain = true },
  { pattern = "www.suckless-kanji.com", custom_domain = true },
  { pattern = "kanji.yuranu.com", custom_domain = true }, # old domain, redirects (see vars)
]

[assets]
directory = "web"
binding = "ASSETS"
# The Worker sees every request (not just /api and /auth) so it can redirect old domains.
run_worker_first = true

[vars]
GOOGLE_CLIENT_ID = "276404407742-dq3le281o8mocggu96eqltkdds8egf5r.apps.googleusercontent.com"
CANONICAL_HOST = "suckless-kanji.com"
LEGACY_HOSTS = "kanji.yuranu.com"
REDIRECT_LEGACY = "1" # old domain redirects (the Google OAuth client allows the canonical one)

[[d1_databases]]
binding = "DB"
database_name = "suckless-kanji"
database_id = "094483b8-10ca-4e37-9584-4560f84b95eb" # replaced by the real id on first deploy
migrations_dir = "server/migrations"
